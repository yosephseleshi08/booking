    <path d="M 120 28 L 112 70 L 96 100 L 108 94 L 88 126 L 80 126 L 102 88 L 88 94 L 110 52 Z" fill="#0C0A09" />
    <path d="M 146 58 L 132 88 L 124 108 L 132 104 L 116 128 L 108 128 L 124 96 L 116 100 L 136 68 Z" fill="#0C0A09" />
  </g>

  <!-- Typography -->
  <text x="120" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="3.5" fill="url(#ridgeGoldLight)">
    RIDGE CREATIVE
  </text>
  <text x="120" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="5" fill="#FBBF24">
    WEB STUDIO
  </text>
