<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Prevent cross-origin iframe SecurityErrors from interrupting app execution in sandboxed previews
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        if (
          msg.indexOf('cross-origin frame') !== -1 ||
          msg.indexOf('Blocked a frame with origin') !== -1 ||
          msg.indexOf('SecurityError') !== -1
        ) {
          e.preventDefault && e.preventDefault();
          e.stopPropagation && e.stopPropagation();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason;
        var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        if (
          msg.indexOf('cross-origin frame') !== -1 ||
          msg.indexOf('Blocked a frame with origin') !== -1 ||
          msg.indexOf('SecurityError') !== -1 ||
          (reason && reason.name === 'SecurityError')
        ) {
          e.preventDefault && e.preventDefault();
          e.stopPropagation && e.stopPropagation();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      }, true);
    </script>

  </body>
</html>
